name: build-release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            gradlew: .\gradlew.bat
          - os: ubuntu-latest
            target: linux-x64
            gradlew: ./gradlew
          - os: macos-latest
            target: macos-arm64
            gradlew: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build uber jar
        run: ${{ matrix.gradlew }} packageUberJarForCurrentOS --no-daemon --stacktrace
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: build/compose/jars/*.jar

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI installer
        run: .\gradlew.bat packageMsi --no-daemon --stacktrace
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: build/compose/binaries/main/msi/*.msi

  release:
    needs: [jar, msi]
    if: ${{ always() && needs.jar.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: prep
        run: |
          VERSION=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Collect jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
      - name: Prepare release files
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p rel
          for d in dist/jar-*; do
            t="${d#dist/jar-}"
            f=$(ls "$d"/*.jar | head -n1)
            cp "$f" "rel/SchoolRadioDesktop_v${VERSION}-${t}.jar"
          done
          ls -la rel
      - name: Attach MSI
        if: ${{ needs.msi.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: msi
          path: msi
      - name: Rename MSI
        if: ${{ needs.msi.result == 'success' }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p relmsi
          f=$(ls msi/*.msi | head -n1)
          cp "$f" "relmsi/SchoolRadioDesktop_v${VERSION}-windows-x64.msi"
      - name: Build release notes
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          cat > notes.md <<EOF
          إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}

          جديد في v${VERSION} — مواكبة كاملة لقدرات نسخة الهاتف التسع:
          • المستخدمون والأدوار: مشرف/معلم/طالب بنفس مصفوفة نسخة الهاتف — الطالب يبثّ ويسجّل ويحضّر، المعلم يدير الجدولة والتسجيلات، المشرف يدير المستخدمين والنسخ الاحتياطي. تبديل الهوية من أسفل القائمة الجانبية، والبوابات مفروضة في منطق التطبيق نفسه لا في الواجهة فقط.
          • الجدولة الأسبوعية الدقيقة: مواعيد ثابتة (يوم + ساعة:دقيقة) تنطلق آليًا أثناء عمل التطبيق — بتنبيه لحظي على صفحات البث واختيار «انطلاق آلي للحلقة» — مع قيد فريد (حدث+تاريخ) يمنع التكرار اليومي، و«سجل التنفيذ» يقيد كل إطلاق وفائت بالتاريخ، وفحص الفائت بعد إغلاق التطبيق أو تغيّر الوقت يعيد التهيئة تلقائيًا.
          • النسخ الاحتياطي JSON: ملف واحد يجمع الإعدادات والمستخدمين والسكريبت والجدولة والأحداث وسجل التنفيذ والمكتبة وقائمة التشغيل — فحص إصدار وصياغة قبل الاستبدال ونسخ أمان ‎.bak قبل كل استبدال (للمشرف).
          • توقيع المُسجِّل: كل تسجيل مكتمل يُختم آليًا باسم من سجّله ودوره، ويظهر في مكتبة التسجيلات وينتقل مع إعادة التسمية.
          • المكتبة الصوتية المصنفة: التصنيفات الافتراضية السبع كما في الهاتف + تصنيفات مخصصة، فهرس دائم بعد إعادة التشغيل، بحث بالاسم والتصنيف، وكشف الملفات المفقودة من القرص مع «إعادة ربط» بضغطة.
          • قائمة التشغيل الدائمة: تُحفظ المسارات والمقطع الجاري بعد إعادة التشغيل، إعادة ترتيب (أعلى/أسفل)، وتكرار القائمة عند بلوغ النهاية.
          • تخطي الملفات التالفة: الفشل في فتح مقطع ينتقل للتالي آليًا بدل التوقف.
          • اسم المدرسة في اللوحة: يظهر في الاستوديو المدمج ورأس القائمة الجانبية (تعديله لمعلم فأعلى).
          • الجودة: 90+ اختبارًا وحدويًا ناجحًا + فحص ذاتي موسّع.

          ما الجديد في v0.8.0 — واجهة بطابع غرفة التحكم:
          • قائمة جانبية بأيقونات وكبسولة تحديد، مقياس بث مقطعي 24 مقطعًا بمناطق وذروة، مؤشر هواء نابض، انتقالات ناعمة، وبطاقات بث مشتركة بعد تنحيف النسختين.

          ما الجديد في v0.7.0 — إصلاح جذري لفتح الميكروفون على الأجهزة المقيّدة:
          • المفاوضة على الصيغ تبدأ من الصيغ التي يعلنها الميكروفون نفسه، وشبكة النسق المرشحة 18 نسقًا، ورسالة عربية نظيفة ترشد عمليًا.

          ما الجديد في v0.6.0 — عودة الاستوديو المدمج:
          • شاشة «الاستوديو المدمج» شاشةً افتراضية عند الإقلاع: جدولة الفقرات + لوحة قراءة السكريبت + البث في ثلاثة أعمدة متزامنة، مع شريط علوي فيه مؤشر «على الهواء» المجمّع وساعة حية.

          الوظائف الأساسية (من v0.1.0 و v0.2.0):
          • بث مباشر للميكروفون: اختيار جهاز الإدخال ومخرج السماعات، مقياس مستوى حي، سماع مراقب، وتسجيل WAV أثناء البث.
          • تشغيل الموسيقى: قائمة تشغيل WAV/MP3، بحث زمني، تحكم بالصوت، التالي/السابق، انتقال تلقائي.
          • التسجيلات: مكتبة تسجيلات مع التشغيل وإعادة التسمية والحذف وتغيير المجلد.
          • سكريبت المذيع: تحرير فقرات النص مع لوحة قراءة كبيرة الخط وعدّاد كلمات وزمن قراءة تقديري.
          • جدولة الفقرات: فقرات الحلقة بأنواعها ومدد مخططة وساعة بداية، مع لوحة تشغيل حي.

          الملفات:
          • SchoolRadioDesktop_v${VERSION}-windows-x64.msi — مثبّت ويندوز (يتضمّن جافا، لا يحتاج أي تثبيت مسبق).
          • SchoolRadioDesktop_v${VERSION}-windows-x64.jar — لويندوز عبر جافا 17+ (java -jar).
          • SchoolRadioDesktop_v${VERSION}-linux-x64.jar — للينكس عبر جافا 17+.
          • SchoolRadioDesktop_v${VERSION}-macos-arm64.jar — لماك (Apple Silicon) عبر جافا 17+.

          مشروع مستقل تمامًا عن نسخة الهاتف (school-radio-android).
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          FILES=(rel/*.jar)
          if [ -d relmsi ]; then FILES+=(relmsi/*.msi); fi
          gh release create "$TAG" "${FILES[@]}" \
            --title "إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}" \
            --notes-file notes.md --latest
