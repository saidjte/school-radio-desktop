name: build-release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            gradlew: .\gradlew.bat
          - os: ubuntu-latest
            target: linux-x64
            gradlew: ./gradlew
          - os: macos-latest
            target: macos-arm64
            gradlew: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build uber jar
        run: ${{ matrix.gradlew }} packageUberJarForCurrentOS --no-daemon --stacktrace
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: build/compose/jars/*.jar

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI installer
        run: .\gradlew.bat packageMsi --no-daemon --stacktrace
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: build/compose/binaries/main/msi/*.msi

  release:
    needs: [jar, msi]
    if: ${{ always() && needs.jar.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: prep
        run: |
          VERSION=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Collect jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
      - name: Prepare release files
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p rel
          for d in dist/jar-*; do
            t="${d#dist/jar-}"
            f=$(ls "$d"/*.jar | head -n1)
            cp "$f" "rel/SchoolRadioDesktop_v${VERSION}-${t}.jar"
          done
          ls -la rel
      - name: Attach MSI
        if: ${{ needs.msi.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: msi
          path: msi
      - name: Rename MSI
        if: ${{ needs.msi.result == 'success' }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p relmsi
          f=$(ls msi/*.msi | head -n1)
          cp "$f" "relmsi/SchoolRadioDesktop_v${VERSION}-windows-x64.msi"
      - name: Build release notes
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          cat > notes.md <<EOF
          إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}

          جديد في v${VERSION} — تطوير الواجهة الرسومية بهوية بصرية احترافية موحدة (طلب المستخدم: «طور (GUI) الخاص بالتطبيق»):
          • خط عربي مدمج Noto Sans Arabic بأربعة أوزان يُحمَّل من موارد التطبيق فتبدو الواجهة واحدة على ويندوز ولينكس وماك بدل خطوط النظام المتفاوتة، مع سلّم طباعي مضبوط: عناوين أثقل ومتون أرحب وشِعارات أدق.
          • ثيم غرفة إذاعة أعمق الطبقات (خلفية ← سطح ← سطح متغاير) وحواف بطاقات مرسومة بدل الاعتماد على الفارق اللوني وحده — ونواة ألوان نقية مختبرة برياضيات تباين WCAG 2.1 فنص شارة الهواء فوق خلفيتها ≥ 4.5:1 وطبقات الثيم متمايزة.
          • مكوّنات موحدة عبر كل الشاشات: بطاقة 16dp بحافة مرسومة للميكروفون والموسيقى والمشغل والتسجيلات، ترويسة أقسام بشريحة تمييز سماوية وعنوان ثقيل، كبسولات حالة دلالية، وأزرار بارتفاع 36dp وزاوية 10dp وثقل موحد.
          • مقاييس المستوى صارت مقطعية 12 مقطعًا بألوان المناطق الإذاعية نفسها (أخضر 0-13 / كهرماني 14-19 / أحمر 20-23) والمناطق المطفأة داكنة محفظة الهوية، وفواصل سحب الحيزات الخمسة تتوهج سماويًا عند مرور الفأرة فتعلن قابلية السحب بوضوح.
          • هوية النافذة: شعار البث في الشريط العلوي وخط تدرج أسفله يربط الرأس بالمحتوى، شريط تمييز جانبي للعنصر المحدد في القائمة الجانبية، أيقونة تطبيق للنافذة وشريط المهام وللمثبّت (MSI)، وحد أدنى لحجم النافذة 1024×640 يحفظ تخطيط الاستوديو من الانهيار.
          • الجودة: 179 اختبارًا وحدويًا ناجحًا (+8: تباين WCAG وتناظره، تمايز طبقات الثيم، حدود مناطق المقاطع الـ24 والإطفاء المحفظ للهوية، سحرة TTF لأوزان الخط الأربعة وسحر PNG لأيقونة النافذة داخل الجرة) + فحص ذاتي selftest يصرّح بالإصدار (0.22.0) + فحص بصري تحت Xvfb: الاستوديو والبث المباشر بالهوية الجديدة كاملة.

          ما الجديد في v0.21.0 — حيزات الاستوديو بالفأرة وشاشة قراءة بسكريبت واحد يزحف من الأسفل إلى الأعلى: فواصل سحب للأبعاد الخمسة (عرض الجانب الأيمن وعمود البث وثلاثة فواصل أفقية داخلية) تُحفظ في settings.json وتعود بين الجلسات، الجانب الأيمن متساويان ٥٠/٥٠، حيّز الموسيقى يأخذ كل المساحة الباقية فتظهر القوائم بعدد صفوف كبير، سطرا المداخل والمخارج في حيّز البث، وشاشة القراءة بفقرة واحدة يبدأ نصها من الحافة السفلية ويمرّ كل سطورها عبر مؤشر القراءة الثابت بتوقف تلقائي.

          ما الجديد في v0.20.0 — شاشة قراءة احترافية ومؤشر قراءة وحفظ الأجهزة والسرعة الرابعة: مؤشر قراءة ثابت في منتصف الشاشة (شريط تركيز + خط إرشادي + سهمان) يزحف النص عبره، الفقرة الجارية بتوهجها الكامل وإطارها الأخضر وبقية الفقرات معتمة، ساعة حية وشريطا تحكم منسقان، سرعة رابعة «سريعة جدًا» 170 بكسل/ث تدور مع الثلاث، حفظ اختيار الأجهزة (مدخلان ومخرجان) بأسمائها في settings.json بارتداد آمن للأول و«بلا» للثاني، وتفضيلات القراءة (خط/سرعة/متابعة) تُذكر بين الجلسات.

          ما الجديد في v0.19.0 — مخرجان ومدخلان وشاشة قراءة تلقيمية: محدد إخراج ثانٍ يُفتح حصريًا على جهازه مع خط إخراج موحّد يكتب نفس الكتلة في الجهازين معًا فتبقى القاعتان نسخة واحدة متطابقة، ومدخل ثانٍ يُفتح بصرامة على جهازه ويُخلط في صوت المذيع قبل السلسلة كلها بخلاط نقّي (طيّ قنوات + إعادة تشكيل خطي + جمع محبوس بلا لفّ أعداد صامتة ولا انزياح تراكمي)، وشاشة سكريبت تلقيمية بملء النافذة بتمرير آلي ومتابعة الجارية وعدّاد فقرات وشريط تقدّم، وأزرار «شاشة القراءة» في اللوحات الثلاث.

          ما الجديد في v0.18.0 — مشهد الصوت: حزمة البث الكاملة بنقرة واحدة (قناع الرعد + بوابة الضجيج + تسوية AGC + الضاغط + منحنى البث عبر حلقتي hpfOn/agcOn الجديدتين والأنماط القديمة لا تمسهما) وأعماق خفض جاهزة بنقرة (خفيف −6dB / متوسط −12dB / قوي −20dB فوق المنزلق الدقيق) ومؤشر AGC الحي «الكسب الآلي الآن: ±X.X dB» لحظة بلحظة أثناء البث.

          ما الجديد في v0.16.0 — معالجة الميكروفون كنسخة الهاتف: لا صدى مهما قارب الميكروفون مكبر الصوت — مانع صدى ثانٍ بمرجع ما يُكتب فعليًا في سماعة المراقبة يلتهم عودة صوت المذيع من الالتقاط، وكشف حديث مزدوج بمعرفة المسار بعد القفل أنهى إنذار جيلجل الخاطئ الدائم مع السماعات القريبة، وكابح بقايا عميق −18dB يخفي ما تبقى كالمانع النظامي، وبطاقة AEC في وحدة المزج تعرض حالة المانعين معًا.

          ما الجديد في v0.15.0 — مشغل موسيقى مستقل بمظهر احترافي أسفل شاشة السكريبت بنفس عرضها وسط الشاشة: شريط تقدم قابل للسعي، أزرار نقل دائرية بأيقونات مرسومة بلا نصوص كبيرة، وعودة حيز الموسيقى (القوائم المسمّاة والمكتبة المصنفة) إلى عمود البث.

          ما الجديد في v0.13.0 — مشغل أقوى + إصلاح جذري للمكتبة + AEC الجيل الثاني: صيغ OGG/FLAC ببوابة صيغ واحدة تمنع دخول ما لا يُفكّ، لا فشل صامت مع شريط خطأ واضح، تكرار ثلاثي وعشوائي بمنطق خالص محفوظ، ومرجع متصل ببحث تأخير خشن ثم دقيق وNLMS زمني 2048 طرقة بمؤشر ERLE حي، وتخفيض تأخير الموسيقى إلى ~85ms وحيز التسجيلات فوق الجدولة.

          ما الجديد في v0.12.0 — مشغل موسيقى احترافي + تصنيف كامل + استوديو يبثّ من مكتبته:
          • قوائم تشغيل مسماة بعدة قوائم بأسمائك وترحيل آلي بلا فقد، بطاقة «قيد التشغيل الآن» الكبيرة بتحكم نقل كامل وقائمة حية قابلة للترتيب والإزالة، رقائق تصنيفات بأعداد المقاطع ونقل المقطع بين التصنيفات، ومشغل هواء كامل في عمود بث الاستوديو والبث المباشر.

          ما الجديد في v0.11.0 — الإذاعة الاحترافية الحقيقية:
          • الخفض التلقائي للموسيقى (Voice-Over Ducker): حين تتكلم على الميكروفون تنخفض الموسيقى آليًا بالمقدار الذي تختاره (3–30dB) وتعود بعد «زمن التعليق» — بمؤشر حي وانتقالات ناعمة.
          • إلغاء صدى الميكروفون (AEC): محلّ تكيّفي يطرح صدى الموسيقى من صوت المذيع — هواء صافٍ بمؤشر حالة حي (النسخة v0.13.0 أعادت بناءه جيلًا ثانيًا بمرجع متصل ومعايرة دقيقة).
          • توحيد الكسب الأوتوماتيكي (AGC): مستوى نطق ثابت بهدف إذاعي وسقف تعزيز وتجميد عند الصمت.
          • الترتيب الإذاعي: AEC ← قناع الرعد ← بوابة ← AGC ← منحنى ← ضاغط ← محدد الأمان ← الفيدرات، كل المعاملات حية ومحفوظة.

          الإصدارات السابقة (v0.10.0 فما دون): وحدة المزج الإذاعية بمعالج صوت المذيع والمعادل خمسة الشرائح، مواكبة قدرات نسخة الهاتف التسع، واجهة بطابع غرفة التحكم، إصلاح فتح الميكروفون على الأجهزة المقيّدة، وعودة الاستوديو المدمج — التفاصيل في ملاحظات كل إصدار.

          الوظائف الأساسية (من v0.1.0 و v0.2.0):
          • بث مباشر للميكروفون: اختيار جهاز الإدخال ومخرج السماعات، مقياس مستوى حي، سماع مراقب، وتسجيل WAV أثناء البث.
          • تشغيل الموسيقى: قائمة تشغيل MP3/WAV/OGG/FLAC، بحث زمني، تحكم بالصوت، التالي/السابق، انتقال تلقائي، تكرار وعشوائية.
          • التسجيلات: مكتبة تسجيلات مع التشغيل وإعادة التسمية والحذف وتغيير المجلد.
          • سكريبت المذيع: تحرير فقرات النص مع لوحة قراءة كبيرة الخط وعدّاد كلمات وزمن قراءة تقديري.
          • جدولة الفقرات: فقرات الحلقة بأنواعها ومدد مخططة وساعة بداية، مع لوحة تشغيل حي.

          الملفات:
          • SchoolRadioDesktop_v${VERSION}-windows-x64.msi — مثبّت ويندوز (يتضمّن جافا، لا يحتاج أي تثبيت مسبق).
          • SchoolRadioDesktop_v${VERSION}-windows-x64.jar — لويندوز عبر جافا 17+ (java -jar).
          • SchoolRadioDesktop_v${VERSION}-linux-x64.jar — للينكس عبر جافا 17+.
          • SchoolRadioDesktop_v${VERSION}-macos-arm64.jar — لماك (Apple Silicon) عبر جافا 17+.

          مشروع مستقل تمامًا عن نسخة الهاتف (school-radio-android).
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          FILES=(rel/*.jar)
          if [ -d relmsi ]; then FILES+=(relmsi/*.msi); fi
          gh release create "$TAG" "${FILES[@]}" \
            --title "إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}" \
            --notes-file notes.md --latest
