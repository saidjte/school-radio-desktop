name: build-release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            gradlew: .\gradlew.bat
          - os: ubuntu-latest
            target: linux-x64
            gradlew: ./gradlew
          - os: macos-latest
            target: macos-arm64
            gradlew: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build uber jar
        run: ${{ matrix.gradlew }} packageUberJarForCurrentOS --no-daemon --stacktrace
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: build/compose/jars/*.jar

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI installer
        run: .\gradlew.bat packageMsi --no-daemon --stacktrace
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: build/compose/binaries/main/msi/*.msi

  release:
    needs: [jar, msi]
    if: ${{ always() && needs.jar.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: prep
        run: |
          VERSION=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Collect jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
      - name: Prepare release files
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p rel
          for d in dist/jar-*; do
            t="${d#dist/jar-}"
            f=$(ls "$d"/*.jar | head -n1)
            cp "$f" "rel/SchoolRadioDesktop_v${VERSION}-${t}.jar"
          done
          ls -la rel
      - name: Attach MSI
        if: ${{ needs.msi.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: msi
          path: msi
      - name: Rename MSI
        if: ${{ needs.msi.result == 'success' }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p relmsi
          f=$(ls msi/*.msi | head -n1)
          cp "$f" "relmsi/SchoolRadioDesktop_v${VERSION}-windows-x64.msi"
      - name: Build release notes
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          cat > notes.md <<EOF
          إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}

          جديد في v${VERSION} — إصلاح جذري لفتح الميكروفون على الأجهزة المقيّدة («unsupported: … TargetDataLine»):
          • المفاوضة على الصيغ أصبحت تبدأ من الجهاز نفسه: يقرأ التطبيق الصيغ التي يعلنها الميكروفون من النظام ويجربها أولًا (مع توسيع الصيغ الناقصة إلى شبكة المعدلات) بدل التخمين على قائمة ثابتة.
          • شبكة النسق المرشحة وُسّعت من 12 إلى 18 نسقًا: أُضيف 11025 و24000 و32000 هرتز (أحادي وثنائي) — أجهزة مقيّدة بمعدل وحيد كانت ترفض القائمة القديمة كاملة وتظهر رسالة «unsupported: … 8000 Hz» بعد إنهاك كل المحاولات.
          • قائمة الميكروفونات لم تعد تُخفي أي جهاز: أي جهاز يعرضه النظام مع خط التقاط يظهر في قائمة «الجهاز…» حتى لو كان مقيدًا بنسق غير مرشّح.
          • الرسالة عند الفشل صارت تحفظ سبب جهازك المختار بدل آخر استثناء عابر من جهاز آخر في المسح، وتُرشد عمليًا: إذن ويندوز للخصوصية ← الميكروفون، إغلاق التطبيقات المستخدمة له، ثم زر «تحديث» — بلا تسريب أي نص إنجليزي خام.
          • إصلاح الغلاف المتراكم في خانة الخطأ («تعذّر فتح الميكروفون: تعذّر فتح…») — رسالة عربية واحدة نظيفة.

          ما الجديد في v0.6.0 — عودة الاستوديو المدمج:
          • شاشة «الاستوديو المدمج» شاشةً افتراضية عند الإقلاع: جدولة الفقرات + لوحة قراءة السكريبت + البث (ميكروفون، موسيقى، تسجيلات) في ثلاثة أعمدة متزامنة، مع شريط علوي فيه مؤشر «على الهواء» المجمّع وساعة حية.
          • بطاقة الميكروفون داخل الاستوديو تحمل محدّد «المخرج» وزر «تحديث» من v0.5.0.

          الوظائف الأساسية (من v0.1.0 و v0.2.0):
          • بث مباشر للميكروفون: اختيار جهاز الإدخال ومخرج السماعات، مقياس مستوى حي، سماع مراقب، وتسجيل WAV أثناء البث.
          • تشغيل الموسيقى: قائمة تشغيل WAV/MP3، بحث زمني، تحكم بالصوت، التالي/السابق، انتقال تلقائي.
          • التسجيلات: مكتبة تسجيلات مع التشغيل وإعادة التسمية والحذف وتغيير المجلد.
          • سكريبت المذيع: تحرير فقرات النص مع لوحة قراءة كبيرة الخط وعدّاد كلمات وزمن قراءة تقديري.
          • جدولة الفقرات: فقرات الحلقة بأنواعها ومدد مخططة وساعة بداية، مع لوحة تشغيل حي.

          الملفات:
          • SchoolRadioDesktop_v${VERSION}-windows-x64.msi — مثبّت ويندوز (يتضمّن جافا، لا يحتاج أي تثبيت مسبق).
          • SchoolRadioDesktop_v${VERSION}-windows-x64.jar — لويندوز عبر جافا 17+ (java -jar).
          • SchoolRadioDesktop_v${VERSION}-linux-x64.jar — للينكس عبر جافا 17+.
          • SchoolRadioDesktop_v${VERSION}-macos-arm64.jar — لماك (Apple Silicon) عبر جافا 17+.

          مشروع مستقل تمامًا عن نسخة الهاتف (school-radio-android).
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          FILES=(rel/*.jar)
          if [ -d relmsi ]; then FILES+=(relmsi/*.msi); fi
          gh release create "$TAG" "${FILES[@]}" \
            --title "إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}" \
            --notes-file notes.md --latest
