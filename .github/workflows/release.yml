name: build-release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            gradlew: .\gradlew.bat
          - os: ubuntu-latest
            target: linux-x64
            gradlew: ./gradlew
          - os: macos-latest
            target: macos-arm64
            gradlew: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build uber jar
        run: ${{ matrix.gradlew }} packageUberJarForCurrentOS --no-daemon --stacktrace
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: build/compose/jars/*.jar

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI installer
        run: .\gradlew.bat packageMsi --no-daemon --stacktrace
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: build/compose/binaries/main/msi/*.msi

  release:
    needs: [jar, msi]
    if: ${{ always() && needs.jar.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: prep
        run: |
          VERSION=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Collect jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
      - name: Prepare release files
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p rel
          for d in dist/jar-*; do
            t="${d#dist/jar-}"
            f=$(ls "$d"/*.jar | head -n1)
            cp "$f" "rel/SchoolRadioDesktop_v${VERSION}-${t}.jar"
          done
          ls -la rel
      - name: Attach MSI
        if: ${{ needs.msi.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: msi
          path: msi
      - name: Rename MSI
        if: ${{ needs.msi.result == 'success' }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p relmsi
          f=$(ls msi/*.msi | head -n1)
          cp "$f" "relmsi/SchoolRadioDesktop_v${VERSION}-windows-x64.msi"
      - name: Build release notes
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          cat > notes.md <<EOF
          إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}

          جديد في v${VERSION} — مشغل موسيقى احترافي + تصنيف كامل + استوديو يبثّ من مكتبته:
          • قوائم تشغيل مسماة: أنشئ أي عدد من القوائم بأسمائها (مثل «فقرة الصباح» و«الأناشيد») وبدّل بينها بضغطة — كل قائمة تحفظ مقاطعها ومقطعها الجاري، والقائمة الجارية تشتغل في المشغل، وحذفها لا يمسّ ملفاتك، وملف القائمة القديم في نسختك السابقة يُرحّل آليًا إلى «القائمة الرئيسية» بلا أي فقد.
          • صفحة الموسيقى بمشغل جديد: بطاقة «قيد التشغيل الآن» بعنوان كبير وشارة تصنيف وموضع المقطع والزمن المتبقي، بحث زمني بالسحب، تحكم نقل كامل (سابق/تشغيل/إيقاف مؤقت/تالي/إيقاف)، تكرار القائمة، ومستوى صوت مع كتم جلسي — وقائمة حية قابلة للترتيب والإزالة مقطعًا مقطعًا.
          • تصنيف المقاطع الموسيقية: رقائق التصنيفات تعرض عدد مقاطع كل تصنيف، ونقل أي مقطع بين التصنيفات من قائمة «نقل إلى ▾» في سطر المقطع، مع البحث الفوري وكشف الملف المفقود وإعادة ربطه (التصنيفات السبع الافتراضية + تصنيفاتك المخصصة).
          • البث والاختيار من الاستوديو: عمود البث في «الاستوديو المدمج» و«البث المباشر» صار مشغل هواء كاملًا — اختر القائمة وشغّلها فورًا، أو افتح «المكتبة» واختر تصنيفًا وانقر أي مقطع ليُبثّ في الحال دون تعديل القائمة، مع شبكة نقل كاملة وفيدر وكتم.
          • ترقية صفحتي الاستوديو والبث المباشر: تنظيم بصري أنظف في عمود البث (بطاقة الميكروفون + مشغل الموسيقى الجديد + التسجيلات)، ولوحة القراءة بخط كبير وتنقّل سلس كما هي.
          • الجودة: 121 اختبارًا وحدويًا ناجحًا (+13 جديدة: ترحيل النسخة السابقة بلا فقد، قيد قائمة واحدة على الأقل، رفض التسميات المكررة، حدود مؤشر الجاري، نقل التصنيفات وعدّادها) + قسم القوائم المسماة في الفحص الذاتي.

          ما الجديد في v0.11.0 — الإذاعة الاحترافية الحقيقية:
          • الخفض التلقائي للموسيقى (Voice-Over Ducker): حين تتكلم على الميكروفون تنخفض الموسيقى آليًا بالمقدار الذي تختاره (3–30dB) وتعود بعد «زمن التعليق» — بمؤشر حي وانتقالات ناعمة.
          • إلغاء صدى الميكروفون (AEC): محلّ تكيّفي NLMS نقي يتعلم مسار الصوت من السماعة إلى الميكروفون ويطرح صدى الموسيقى — هواء صافٍ بمؤشر «مسار مقفل · التأخير المقدّر».
          • توحيد الكسب الأوتوماتيكي (AGC): مستوى نطق ثابت بهدف إذاعي وسقف تعزيز وتجميد عند الصمت.
          • الترتيب الإذاعي: AEC ← قناع الرعد ← بوابة ← AGC ← منحنى ← ضاغط ← محدد الأمان ← الفيدرات، كل المعاملات حية ومحفوظة.

          الإصدارات السابقة (v0.10.0 فما دون): وحدة المزج الإذاعية بمعالج صوت المذيع والمعادل خمسة الشرائح، مواكبة قدرات نسخة الهاتف التسع، واجهة بطابع غرفة التحكم، إصلاح فتح الميكروفون على الأجهزة المقيّدة، وعودة الاستوديو المدمج — التفاصيل في ملاحظات كل إصدار.

          الوظائف الأساسية (من v0.1.0 و v0.2.0):
          • بث مباشر للميكروفون: اختيار جهاز الإدخال ومخرج السماعات، مقياس مستوى حي، سماع مراقب، وتسجيل WAV أثناء البث.
          • تشغيل الموسيقى: قائمة تشغيل WAV/MP3، بحث زمني، تحكم بالصوت، التالي/السابق، انتقال تلقائي.
          • التسجيلات: مكتبة تسجيلات مع التشغيل وإعادة التسمية والحذف وتغيير المجلد.
          • سكريبت المذيع: تحرير فقرات النص مع لوحة قراءة كبيرة الخط وعدّاد كلمات وزمن قراءة تقديري.
          • جدولة الفقرات: فقرات الحلقة بأنواعها ومدد مخططة وساعة بداية، مع لوحة تشغيل حي.

          الملفات:
          • SchoolRadioDesktop_v${VERSION}-windows-x64.msi — مثبّت ويندوز (يتضمّن جافا، لا يحتاج أي تثبيت مسبق).
          • SchoolRadioDesktop_v${VERSION}-windows-x64.jar — لويندوز عبر جافا 17+ (java -jar).
          • SchoolRadioDesktop_v${VERSION}-linux-x64.jar — للينكس عبر جافا 17+.
          • SchoolRadioDesktop_v${VERSION}-macos-arm64.jar — لماك (Apple Silicon) عبر جافا 17+.

          مشروع مستقل تمامًا عن نسخة الهاتف (school-radio-android).
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          FILES=(rel/*.jar)
          if [ -d relmsi ]; then FILES+=(relmsi/*.msi); fi
          gh release create "$TAG" "${FILES[@]}" \
            --title "إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}" \
            --notes-file notes.md --latest
