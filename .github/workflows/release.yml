name: build-release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            gradlew: .\gradlew.bat
          - os: ubuntu-latest
            target: linux-x64
            gradlew: ./gradlew
          - os: macos-latest
            target: macos-arm64
            gradlew: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build uber jar
        run: ${{ matrix.gradlew }} packageUberJarForCurrentOS --no-daemon --stacktrace
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: build/compose/jars/*.jar

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI installer
        run: .\gradlew.bat packageMsi --no-daemon --stacktrace
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: build/compose/binaries/main/msi/*.msi

  release:
    needs: [jar, msi]
    if: ${{ always() && needs.jar.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: prep
        run: |
          VERSION=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Collect jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
      - name: Prepare release files
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p rel
          for d in dist/jar-*; do
            t="${d#dist/jar-}"
            f=$(ls "$d"/*.jar | head -n1)
            cp "$f" "rel/SchoolRadioDesktop_v${VERSION}-${t}.jar"
          done
          ls -la rel
      - name: Attach MSI
        if: ${{ needs.msi.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: msi
          path: msi
      - name: Rename MSI
        if: ${{ needs.msi.result == 'success' }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p relmsi
          f=$(ls msi/*.msi | head -n1)
          cp "$f" "relmsi/SchoolRadioDesktop_v${VERSION}-windows-x64.msi"
      - name: Build release notes
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          cat > notes.md <<EOF
          إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}

          جديد في v${VERSION} — واجهة بطابع غرفة التحكم:
          • قائمة جانبية احترافية: أيقونات مرسومة لكل قسم، كبسولة تحديد واضحة، تظليل عند مرور الفأرة، نقطة «على الهواء» نابضة بجانب البث، وشعار بثّ في رأس القائمة.
          • مقياس مستوى البث صار مقطعيًا بطابع الاستوديوهات: 24 مقطع LED بثلاث مناطق (أخضر مريح، كهرماني انتباه، أحمر قرب التشبع) ومؤشر ذروة يرتفع فورًا وينحسر ببطء — في الميكروفون داخل الاستوديو المدمج والبث المباشر معًا.
          • انتقال ناعم بين الصفحات يخدم السلاسة دون إبطاء التنقل.
          • ثيم داكن أعمق طبقات مع ألوان بثّية دلالية موحّدة (حالة الهواء، التسجيل، مؤشرات التشغيل) بدل ألوان متفرقة في كل شاشة.
          • مؤشر «على الهواء» والنقطة الحمراء للتسجيل صارا نابضين حيًا في الشريط العلوي.
          • بطاقة الموسيقى تعرض خط تقدم تحت العنوان أثناء التشغيل.
          • لوحة قراءة السكريبت في الاستوديو المدمج فيها أزرار «السابقة/التالية» للتنقل بين الفقرات دون مغادرة الشاشة.
          • حالات الفراغ صارت موحّدة: أيقونة + عنوان + توجيه عملي بدل نص خام.
          • تنظيف داخلي: بطاقتا الميكروفون والموسيقى كانتا منسوختين في صفحتين — صارتا مكوّنًا واحدًا مشتركًا، فأي تحسين لاحق يصل الشاشتين دفعة واحدة.

          ما الجديد في v0.7.0 — إصلاح جذري لفتح الميكروفون على الأجهزة المقيّدة:
          • المفاوضة على الصيغ تبدأ من الصيغ التي يعلنها الميكروفون نفسه (مع توسيع الصيغ الناقصة إلى شبكة المعدلات) بدل التخمين على قائمة ثابتة.
          • شبكة النسق المرشحة وُسّعت إلى 18 نسقًا (إضافة 11025/24000/32000 هرتز أحادي وثنائي)، وقائمة الميكروفونات لم تعد تخفي أي جهاز.
          • رسالة الفشل تحفظ سبب جهازك المختار وتُرشد عمليًا (إذن ويندوز للخصوصية ← الميكروفون) — ورسالة عربية واحدة نظيفة بلا تسريب نص خام.

          ما الجديد في v0.6.0 — عودة الاستوديو المدمج:
          • شاشة «الاستوديو المدمج» شاشةً افتراضية عند الإقلاع: جدولة الفقرات + لوحة قراءة السكريبت + البث (ميكروفون، موسيقى، تسجيلات) في ثلاثة أعمدة متزامنة، مع شريط علوي فيه مؤشر «على الهواء» المجمّع وساعة حية.
          • بطاقة الميكروفون داخل الاستوديو تحمل محدّد «المخرج» وزر «تحديث» من v0.5.0.

          الوظائف الأساسية (من v0.1.0 و v0.2.0):
          • بث مباشر للميكروفون: اختيار جهاز الإدخال ومخرج السماعات، مقياس مستوى حي، سماع مراقب، وتسجيل WAV أثناء البث.
          • تشغيل الموسيقى: قائمة تشغيل WAV/MP3، بحث زمني، تحكم بالصوت، التالي/السابق، انتقال تلقائي.
          • التسجيلات: مكتبة تسجيلات مع التشغيل وإعادة التسمية والحذف وتغيير المجلد.
          • سكريبت المذيع: تحرير فقرات النص مع لوحة قراءة كبيرة الخط وعدّاد كلمات وزمن قراءة تقديري.
          • جدولة الفقرات: فقرات الحلقة بأنواعها ومدد مخططة وساعة بداية، مع لوحة تشغيل حي.

          الملفات:
          • SchoolRadioDesktop_v${VERSION}-windows-x64.msi — مثبّت ويندوز (يتضمّن جافا، لا يحتاج أي تثبيت مسبق).
          • SchoolRadioDesktop_v${VERSION}-windows-x64.jar — لويندوز عبر جافا 17+ (java -jar).
          • SchoolRadioDesktop_v${VERSION}-linux-x64.jar — للينكس عبر جافا 17+.
          • SchoolRadioDesktop_v${VERSION}-macos-arm64.jar — لماك (Apple Silicon) عبر جافا 17+.

          مشروع مستقل تمامًا عن نسخة الهاتف (school-radio-android).
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          FILES=(rel/*.jar)
          if [ -d relmsi ]; then FILES+=(relmsi/*.msi); fi
          gh release create "$TAG" "${FILES[@]}" \
            --title "إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}" \
            --notes-file notes.md --latest
