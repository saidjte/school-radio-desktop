name: build-release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            gradlew: .\gradlew.bat
          - os: ubuntu-latest
            target: linux-x64
            gradlew: ./gradlew
          - os: macos-latest
            target: macos-arm64
            gradlew: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build uber jar
        run: ${{ matrix.gradlew }} packageUberJarForCurrentOS --no-daemon --stacktrace
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: build/compose/jars/*.jar

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI installer
        run: .\gradlew.bat packageMsi --no-daemon --stacktrace
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: build/compose/binaries/main/msi/*.msi

  release:
    needs: [jar, msi]
    if: ${{ always() && needs.jar.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: prep
        run: |
          VERSION=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Collect jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
      - name: Prepare release files
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p rel
          for d in dist/jar-*; do
            t="${d#dist/jar-}"
            f=$(ls "$d"/*.jar | head -n1)
            cp "$f" "rel/SchoolRadioDesktop_v${VERSION}-${t}.jar"
          done
          ls -la rel
      - name: Attach MSI
        if: ${{ needs.msi.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: msi
          path: msi
      - name: Rename MSI
        if: ${{ needs.msi.result == 'success' }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p relmsi
          f=$(ls msi/*.msi | head -n1)
          cp "$f" "relmsi/SchoolRadioDesktop_v${VERSION}-windows-x64.msi"
      - name: Build release notes
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          cat > notes.md <<EOF
          إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}

          جديد في v${VERSION} — الإذاعة الاحترافية الحقيقية: خفض تلقائي + إلغاء صدى + توحيد كسب:
          • الخفض التلقائي للموسيقى (Voice-Over Ducker): حين تتكلم على الميكروفون تنخفض الموسيقى آليًا بالمقدار الذي تختاره (3–30dB بمنزلق «نسبة الخفض»)، وعند سكوتك تعود تدريجيًا بعد «زمن التعليق» (0.1–5 ث) — سلوك الاستوديو الإذاعي الحقيقي بلا أن تلمس أي فيدر، بمؤشر حي «منخفضة الآن / جاهز» وانتقالات ناعمة (هجوم 150ms وإفلات أُسّي) بلا طقطقة.
          • إلغاء صدى الميكروفون (AEC): محلّ تكيّفي NLMS نقيّ بلا أي مكتبات خارجية — يتعلم مسار الصوت من السماعة إلى الميكروفون ويطرح صدى الموسيقى من صوتك تلقائيًا، فيبقى هواء البث والتسجيلات صوت مذيع صافيًا. بحث دوري عن التأخير الكلي (±750ms)، إعادة قياس تلقائية بين معدل الموسيقى ومعدل الميكروفون، تجميد عند صمت المرجع كي لا يطارد الضجيج، وحارس انحراف يعيد التصفير إن تدهور المسار — ومرور نظيف تام حين لا موسيقى تعمل. بمؤشر حي «مسار مقفل · التأخير المقدّر».
          • توحيد الكسب الأوتوماتيكي (AGC): مستوى نطق ثابت مهما ابتعدت عن الميكروفون — «مستوى الهدف» (-30..-6dBFS) و«أقصى تعزيز» (6..30dB)، كسب يتحرك ببطء فلا مضخّ ولا قفزات، وتجميد كامل عند الصمت كي لا يضخّم أرضية الضجيج. مفعل افتراضيًا بهدف الإذاعة -18dBFS.
          • الترتيب الإذاعي الصحيح: AEC أولًا (قبل أي معالجة لاحية) ← قناع الرعد ← بوابة الضجيج ← AGC ← منحنى الصوت ← الضاغط ← محدّد الأمان ← الفيدرات. كل المعاملات حية أثناء البث بلا قطع صوت، وتُحفظ وتُستعاد مع الإعدادات.
          • الجودة: 108 اختبارًا وحدويًا ناجحًا (+24 جديدة: تقارب AGC وتجميده، إلغاء الصدى على صدى تركيبي معروف بتأخير 120ms وقفل المسار ومرور المرجع الراكد، هبوط الخفض وتعليقه وعودته وحدوده) + فحص ذاتي موسّع بقسمين جددا.

          ما الجديد في v0.10.0 — وحدة المزج الإذاعية:
          • وحدة المزج: صفحة كاملة بثلاث قنوات (الميكروفون، الموسيقى، الماستر) بفيدرات 0–150% وقراءة ديسيبل وكتم جلسي ومقاييس حية.
          • معالج صوت المذيع: قناع رعد 85هرتز + بوابة ضجيج بمؤشر حي + ضاغط + منحنى إذاعي ثلاثي (180هرتز/3.2ك/8ك) + محدّد أمان، بأربعة أنماط جاهزة.
          • معادل الصوت خمس الشرائح لقناة الموسيقى (80/250/1ك/3.5ك/10ك ±12dB) بخمسة أنماط إذاعية.

          ما الجديد في v0.9.0 — مواكبة كاملة لقدرات نسخة الهاتف التسع:
          • المستخدمون والأدوار (مشرف/معلم/طالب ببوابات في المنطق)، الجدولة الأسبوعية الدقيقة بتنبيه لحظي وانطلاق آلي وقيد فريد (حدث+تاريخ) وسجل تنفيذ، النسخ الاحتياطي JSON بنسخ أمان .bak، توقيع المُسجِّل، المكتبة المصنفة بالتصنيفات السبع وكشف المفقود، قائمة تشغيل دائمة بتخطي التالف، واسم المدرسة في اللوحة.

          ما الجديد في v0.8.0 — واجهة بطابع غرفة التحكم:
          • قائمة جانبية بأيقونات وكبسولة تحديد، مقياس بث مقطعي 24 مقطعًا بمناطق وذروة، مؤشر هواء نابض، انتقالات ناعمة، وبطاقات بث مشتركة بعد تنحيف النسختين.

          ما الجديد في v0.7.0 — إصلاح جذري لفتح الميكروفون على الأجهزة المقيّدة:
          • المفاوضة على الصيغ تبدأ من الصيغ التي يعلنها الميكروفون نفسه، وشبكة النسق المرشحة 18 نسقًا، ورسالة عربية نظيفة ترشد عمليًا.

          ما الجديد في v0.6.0 — عودة الاستوديو المدمج:
          • شاشة «الاستوديو المدمج» شاشةً افتراضية عند الإقلاع: جدولة الفقرات + لوحة قراءة السكريبت + البث في ثلاثة أعمدة متزامنة، مع شريط علوي فيه مؤشر «على الهواء» المجمّع وساعة حية.

          الوظائف الأساسية (من v0.1.0 و v0.2.0):
          • بث مباشر للميكروفون: اختيار جهاز الإدخال ومخرج السماعات، مقياس مستوى حي، سماع مراقب، وتسجيل WAV أثناء البث.
          • تشغيل الموسيقى: قائمة تشغيل WAV/MP3، بحث زمني، تحكم بالصوت، التالي/السابق، انتقال تلقائي.
          • التسجيلات: مكتبة تسجيلات مع التشغيل وإعادة التسمية والحذف وتغيير المجلد.
          • سكريبت المذيع: تحرير فقرات النص مع لوحة قراءة كبيرة الخط وعدّاد كلمات وزمن قراءة تقديري.
          • جدولة الفقرات: فقرات الحلقة بأنواعها ومدد مخططة وساعة بداية، مع لوحة تشغيل حي.

          الملفات:
          • SchoolRadioDesktop_v${VERSION}-windows-x64.msi — مثبّت ويندوز (يتضمّن جافا، لا يحتاج أي تثبيت مسبق).
          • SchoolRadioDesktop_v${VERSION}-windows-x64.jar — لويندوز عبر جافا 17+ (java -jar).
          • SchoolRadioDesktop_v${VERSION}-linux-x64.jar — للينكس عبر جافا 17+.
          • SchoolRadioDesktop_v${VERSION}-macos-arm64.jar — لماك (Apple Silicon) عبر جافا 17+.

          مشروع مستقل تمامًا عن نسخة الهاتف (school-radio-android).
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          FILES=(rel/*.jar)
          if [ -d relmsi ]; then FILES+=(relmsi/*.msi); fi
          gh release create "$TAG" "${FILES[@]}" \
            --title "إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}" \
            --notes-file notes.md --latest
