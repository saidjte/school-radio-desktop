name: build-release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            gradlew: .\gradlew.bat
          - os: ubuntu-latest
            target: linux-x64
            gradlew: ./gradlew
          - os: macos-latest
            target: macos-arm64
            gradlew: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build uber jar
        run: ${{ matrix.gradlew }} packageUberJarForCurrentOS --no-daemon --stacktrace
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: build/compose/jars/*.jar

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI installer
        run: .\gradlew.bat packageMsi --no-daemon --stacktrace
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: build/compose/binaries/main/msi/*.msi

  release:
    needs: [jar, msi]
    if: ${{ always() && needs.jar.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: prep
        run: |
          VERSION=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Collect jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
      - name: Prepare release files
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p rel
          for d in dist/jar-*; do
            t="${d#dist/jar-}"
            f=$(ls "$d"/*.jar | head -n1)
            cp "$f" "rel/SchoolRadioDesktop_v${VERSION}-${t}.jar"
          done
          ls -la rel
      - name: Attach MSI
        if: ${{ needs.msi.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: msi
          path: msi
      - name: Rename MSI
        if: ${{ needs.msi.result == 'success' }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p relmsi
          f=$(ls msi/*.msi | head -n1)
          cp "$f" "relmsi/SchoolRadioDesktop_v${VERSION}-windows-x64.msi"
      - name: Build release notes
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          cat > notes.md <<EOF
          إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}

          جديد في v${VERSION} — جدار الجينغل مع زر فتحه من الاستوديو المدمج في نافذة منبثقة لا تعرقل العمل (طلبا المستخدم):
          • جدار الجينغل: اثنا عشر موضعًا كالجدران الإذاعية الحقيقية — نقرة تُطلق الصوت من الصفر ونقرة ثانية توقفه، ويمكن لمواضع عدة أن تعمل في نفس اللحظة دون أن يمس بعضها، مع زر «إيقاف الكل» ومستوى عام للجينلات يسري على الجاري فورًا ويُحفظ بين الجلسات.
          • سبع جينلات مدرسية مدمجة بالجرة نفسها (جرس المدرسة، افتتاحية مبهجة، مقدمة فقرة، انتقال ساحر، علامة سريعة، مرور هوائي، ختام هادئ — نفس جينلات نسخة الهاتف وتراخيصها) تُستخرج تلقائيًا عند أول تشغيل وتملأ المواضع السبعة الأولى، والخمسة الباقية فارغة لتعيين مقاطع المدرسة الخاصة من أي ملف WAV/MP3/OGG/FLAC — والتعيين والمسح يُحفظان في settings.json ويعودان بين الجلسات.
          • النافذة المنبثقة: زر «جدار الجينغل» في الشريط العلوي للاستوديو المدمج يفتح الجدار بنافذة مستقلة غير ماسكة — تبقى مفتوحة بجوار الاستوديو ويظل بثك وسكريبتك وجدولتك قابلين للعمل بكامل أدواتهما ما دامت مفتوحة، والجينلات تخرج من مخرجَي الموسيقى المختارَين نفسهما (سماعة + قاعة).
          • الإثبات آليًا: محرك أصوات متعددة بخيوط مستقلة وخط حقن صوت مزيف بلا عتاد — 11 اختبارًا جديدًا (الجينلات السبع بأسمائها المطابقة للهاتف، الاستخراج المكرر الآمن، تعقيم الملفات اليدوية والعقد الدائري للمخزن، التبديل والإيقاف، تزامن ثلاثة مواضع مع إيقاف فردي لا يمس البقية، المستوى الحي المحبوس، خطأ الملف المفقود، الإنهاء الطبيعي، حرس المدى) وفحص العقد نفسه داخل selftest الجرة المشحونة.
          • كل القدرات السابقة بلا مساس: إصلاح شريط التقدم بالنقر والسحب (v0.27.0)، والتحكم الحر في سرعة التلقيم مع «بطيئة جدًا» (v0.26.0)، واستيراد يوتيوب (v0.25.0)، والخطوط الأربعة (v0.24.0)، وشريط السعي نفسه (v0.23.0).
          • الجودة: 235 اختبارًا وحدويًا ناجحًا (+11 عقد الجدار) + SELFTEST OK — version 0.28.0 + فحص بصري تحت Xvfb للنافذة المنبثقة والاستوديو معًا (إطلاق موضعين من الجدار بعدّادات حية، وعمل الاستوديو مستمرًا والنافذة مفتوحة، وإغلاقها بسلام).

          ما الجديد في v0.27.0 — إصلاح جذري لعطل «شريط التقدم بالنقر والسحب في المشغل لا يعمل جيدًا»: العطل كان في العرض لا الصوت ولا الإيماءة — عرض الموضع كان يتحدث من قراءة الكتل فقط بينما السعي يُنفَّذ في القارئ مباشرة، فالإفلات أثناء التشغيل يومض للموضع القديم وأثناء الإيقاف المؤقت كان الارتداد كاملًا ودائمًا؛ الإصلاح بتحديث متفائل فوري وترسيخ العرض على موضع القارئ بعد السعي مع فوز آخر نقرة، ويرثه شريطا الموسيقى والمشغل المستقل معًا، بخمسة اختبارات عقد على حلقة المحرك الحقيقية بقارئ مزيف.

          ما الجديد في v0.26.0 — تحكم حر في سرعة التلقيم مع «بطيئة جدًا» وتوحيد تحكم حيزات العمود الأيسر وإصلاح عطل Program Files في استيراد يوتيوب: منزلق حر (6–260 بكسل/ث) بقراءة رقمية حية واسم حالة وخمس جاهزات أضافت «بطيئة جدًا» (12) والحرة تُحفظ بين الجلسات، بطاقتا الميكروفون والموسيقى يسارًا يتغير حجمهما بالفاصل كالعمود الأيمن تمامًا مع تمرير داخلي للميكروفون، وأداة يوتيوب تعمل في مجلد مؤقت آمن قابل للكتابة بلا Errno 13 داخل Program Files مع رسالة عربية واضحة.

          ما الجديد في v0.25.0 — استيراد المقاطع الموسيقية من اليوتيوب في صفحة الموسيقى مع تحميلها: زر «استيراد من يوتيوب» يفتح حوارًا يفهم الرابط والبحث معًا ببطاقة مقطع ونتائج بحث واختيار التصنيف، الأداة مدمجة لكل منصة (yt-dlp: ويندوز/لينكس/ماك) بلا تثبيت خارجي بتقدم حي وإلغاء، والتحويل محلي نقي AAC→MP3 بJAAD وLAME فتدخل المقاطع المكتبة بأضمن صيغة لمحرك البث، مع تصنيف عربي للأخطاء وخيار ملف كوكيز.

          ما الجديد في v0.24.0 — نظام الطباعة الرباعي المدمج: Cairo للمتون والنصوص وChanga للعناوين وOrbitron للأرقام والساعات والأزمنة عبر نمط numeric() وSpicy Sale للهوية اللاتينية المرحة عبر brand()، كلها تُحمَّل من موارد الجرة فتبدو الواجهة واحدة على ويندوز ولينكس وماك، مع وثيقة تراخيص LICENSES.md وإسناد طباعي نقي مختبر.

          ما الجديد في v0.23.0 — التنقل في المقطع بالنقر والسحب في شريط التقدم: مكوّن StudioSeekBar مرسوم بيد بدل Slider المكتبة المعطوب بإيماءات الفأرة على الحاسوب — النقر ينقل فورًا والسحب يعاين حيًّا ثم سعي واحد بالضبط عند الإفلات بحالة ScrubState نقية، في مشغلي الموسيقى معًا باتجاه LTR وهالة سماوية وحاضن لمس 36dp، وسعي MP3 أدق بجدول Xing المئوي ومتوسط معدل البت للـVBR ومعدل الإطار الأول للـCBR، مع إصلاح زر «تشغيل» الميت بعد إعادة فتح التطبيق.

          ما الجديد في v0.22.0 — تطوير الواجهة الرسومية بهوية بصرية موحدة: خط عربي مدمج Noto Sans Arabic بأربعة أوزان من موارد الجرة فتبدو الواجهة واحدة على كل الأنظمة، ثيم أعمق الطبقات بحواف بطاقات مرسومة وتباين WCAG 2.1 مختبر، مكوّنات موحدة (بطاقات 16dp وترويسات أقسام وكبسولات حالة وأزرار 36dp)، مقاييس مستوى مقطعية بألوان المناطق الإذاعية، توهج سماوي لفواصل سحب الحيزات، شعار وأيقونة للنافذة والمثبّت، وحد أدنى للنافذة 1024×640.

          ما الجديد في v0.21.0 — حيزات الاستوديو بالفأرة وشاشة قراءة بسكريبت واحد يزحف من الأسفل إلى الأعلى: فواصل سحب للأبعاد الخمسة (عرض الجانب الأيمن وعمود البث وثلاثة فواصل أفقية داخلية) تُحفظ في settings.json وتعود بين الجلسات، الجانب الأيمن متساويان ٥٠/٥٠، حيّز الموسيقى يأخذ كل المساحة الباقية فتظهر القوائم بعدد صفوف كبير، سطرا المداخل والمخارج في حيّز البث، وشاشة القراءة بفقرة واحدة يبدأ نصها من الحافة السفلية ويمرّ كل سطورها عبر مؤشر القراءة الثابت بتوقف تلقائي.

          ما الجديد في v0.20.0 — شاشة قراءة احترافية ومؤشر قراءة وحفظ الأجهزة والسرعة الرابعة: مؤشر قراءة ثابت في منتصف الشاشة (شريط تركيز + خط إرشادي + سهمان) يزحف النص عبره، الفقرة الجارية بتوهجها الكامل وإطارها الأخضر وبقية الفقرات معتمة، ساعة حية وشريطا تحكم منسقان، سرعة رابعة «سريعة جدًا» 170 بكسل/ث تدور مع الثلاث، حفظ اختيار الأجهزة (مدخلان ومخرجان) بأسمائها في settings.json بارتداد آمن للأول و«بلا» للثاني، وتفضيلات القراءة (خط/سرعة/متابعة) تُذكر بين الجلسات.

          ما الجديد في v0.19.0 — مخرجان ومدخلان وشاشة قراءة تلقيمية: محدد إخراج ثانٍ يُفتح حصريًا على جهازه مع خط إخراج موحّد يكتب نفس الكتلة في الجهازين معًا فتبقى القاعتان نسخة واحدة متطابقة، ومدخل ثانٍ يُفتح بصرامة على جهازه ويُخلط في صوت المذيع قبل السلسلة كلها بخلاط نقّي (طيّ قنوات + إعادة تشكيل خطي + جمع محبوس بلا لفّ أعداد صامتة ولا انزياح تراكمي)، وشاشة سكريبت تلقيمية بملء النافذة بتمرير آلي ومتابعة الجارية وعدّاد فقرات وشريط تقدّم، وأزرار «شاشة القراءة» في اللوحات الثلاث.

          ما الجديد في v0.18.0 — مشهد الصوت: حزمة البث الكاملة بنقرة واحدة (قناع الرعد + بوابة الضجيج + تسوية AGC + الضاغط + منحنى البث عبر حلقتي hpfOn/agcOn الجديدتين والأنماط القديمة لا تمسهما) وأعماق خفض جاهزة بنقرة (خفيف −6dB / متوسط −12dB / قوي −20dB فوق المنزلق الدقيق) ومؤشر AGC الحي «الكسب الآلي الآن: ±X.X dB» لحظة بلحظة أثناء البث.

          ما الجديد في v0.13.0 — مشغل أقوى + إصلاح جذري للمكتبة + AEC الجيل الثاني: صيغ OGG/FLAC ببوابة صيغ واحدة تمنع دخول ما لا يُفكّ، لا فشل صامت مع شريط خطأ واضح، تكرار ثلاثي وعشوائي بمنطق خالص محفوظ، ومرجع متصل ببحث تأخير خشن ثم دقيق وNLMS زمني 2048 طرقة بمؤشر ERLE حي، وتخفيض تأخير الموسيقى إلى ~85ms وحيز التسجيلات فوق الجدولة.

          ما الجديد في v0.12.0 — مشغل موسيقى احترافي + تصنيف كامل + استوديو يبثّ من مكتبته:
          • قوائم تشغيل مسماة بعدة قوائم بأسمائك وترحيل آلي بلا فقد، بطاقة «قيد التشغيل الآن» الكبيرة بتحكم نقل كامل وقائمة حية قابلة للترتيب والإزالة، رقائق تصنيفات بأعداد المقاطع ونقل المقطع بين التصنيفات، ومشغل هواء كامل في عمود بث الاستوديو والبث المباشر.

          ما الجديد في v0.11.0 — الإذاعة الاحترافية الحقيقية:
          • الخفض التلقائي للموسيقى (Voice-Over Ducker): حين تتكلم على الميكروفون تنخفض الموسيقى آليًا بالمقدار الذي تختاره (3–30dB) وتعود بعد «زمن التعليق» — بمؤشر حي وانتقالات ناعمة.
          • إلغاء صدى الميكروفون (AEC): محلّ تكيّفي يطرح صدى الموسيقى من صوت المذيع — هواء صافٍ بمؤشر حالة حي (النسخة v0.13.0 أعادت بناءه جيلًا ثانيًا بمرجع متصل ومعايرة دقيقة).
          • توحيد الكسب الأوتوماتيكي (AGC): مستوى نطق ثابت بهدف إذاعي وسقف تعزيز وتجميد عند الصمت.
          • الترتيب الإذاعي: AEC ← قناع الرعد ← بوابة ← AGC ← منحنى ← ضاغط ← محدد الأمان ← الفيدرات، كل المعاملات حية ومحفوظة.

          الإصدارات السابقة (v0.15.0 فما دون): المشغّل المستقل ببطاقة «قيد التشغيل الآن» وشريط تقدم قابل للسعي (v0.15.0)، وحدة المزج الإذاعية بمعالج صوت المذيع والمعادل خمسة الشرائح، مواكبة قدرات نسخة الهاتف التسع، واجهة بطابع غرفة التحكم، إصلاح فتح الميكروفون على الأجهزة المقيّدة، وعودة الاستوديو المدمج — التفاصيل في ملاحظات كل إصدار.

          الوظائف الأساسية (من v0.1.0 و v0.2.0):
          • بث مباشر للميكروفون: اختيار جهاز الإدخال ومخرج السماعات، مقياس مستوى حي، سماع مراقب، وتسجيل WAV أثناء البث.
          • تشغيل الموسيقى: قائمة تشغيل MP3/WAV/OGG/FLAC، بحث زمني، تحكم بالصوت، التالي/السابق، انتقال تلقائي، تكرار وعشوائية.
          • التسجيلات: مكتبة تسجيلات مع التشغيل وإعادة التسمية والحذف وتغيير المجلد.
          • سكريبت المذيع: تحرير فقرات النص مع لوحة قراءة كبيرة الخط وعدّاد كلمات وزمن قراءة تقديري.
          • جدولة الفقرات: فقرات الحلقة بأنواعها ومدد مخططة وساعة بداية، مع لوحة تشغيل حي.

          الملفات:
          • SchoolRadioDesktop_v${VERSION}-windows-x64.msi — مثبّت ويندوز (يتضمّن جافا، لا يحتاج أي تثبيت مسبق).
          • SchoolRadioDesktop_v${VERSION}-windows-x64.jar — لويندوز عبر جافا 17+ (java -jar).
          • SchoolRadioDesktop_v${VERSION}-linux-x64.jar — للينكس عبر جافا 17+.
          • SchoolRadioDesktop_v${VERSION}-macos-arm64.jar — لماك (Apple Silicon) عبر جافا 17+.

          مشروع مستقل تمامًا عن نسخة الهاتف (school-radio-android).
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          FILES=(rel/*.jar)
          if [ -d relmsi ]; then FILES+=(relmsi/*.msi); fi
          gh release create "$TAG" "${FILES[@]}" \
            --title "إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}" \
            --notes-file notes.md --latest
