name: build-release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            gradlew: .\gradlew.bat
          - os: ubuntu-latest
            target: linux-x64
            gradlew: ./gradlew
          - os: macos-latest
            target: macos-arm64
            gradlew: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build uber jar
        run: ${{ matrix.gradlew }} packageUberJarForCurrentOS --no-daemon --stacktrace
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: build/compose/jars/*.jar

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI installer
        run: .\gradlew.bat packageMsi --no-daemon --stacktrace
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: build/compose/binaries/main/msi/*.msi

  release:
    needs: [jar, msi]
    if: ${{ always() && needs.jar.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: prep
        run: |
          VERSION=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Collect jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
      - name: Prepare release files
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p rel
          for d in dist/jar-*; do
            t="${d#dist/jar-}"
            f=$(ls "$d"/*.jar | head -n1)
            cp "$f" "rel/SchoolRadioDesktop_v${VERSION}-${t}.jar"
          done
          ls -la rel
      - name: Attach MSI
        if: ${{ needs.msi.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: msi
          path: msi
      - name: Rename MSI
        if: ${{ needs.msi.result == 'success' }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p relmsi
          f=$(ls msi/*.msi | head -n1)
          cp "$f" "relmsi/SchoolRadioDesktop_v${VERSION}-windows-x64.msi"
      - name: Build release notes
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          cat > notes.md <<EOF
          إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}

          جديد في v${VERSION} — صفحة المونتاج: الترقية الاحترافية (البنود 1–15 من مقترحات الاحترافية) فوق صفحة المونتاج القائمة:
          • خط زمني احترافي بموجات صوتية حقيقية (البند 1): كل مقطع يُرسم بمغلّف ذرواته المحسوب من فكّ المصدر نفسه بلا عتاد ولا شبكة، مع مسطرة زمن متكيفة مع التكبير (1/2/5 ثوانٍ)، وتكبير 15–800 بكسل/ث، وخريطة مصغرة بنظرة عامة ومستطيل العرض الحالي يسحبك إلى المشهد الذي تريد، ورأس تشغيل كهرماني بالنقر ينتقل وبالسحب يمسح.
          • قصّ وتقسيم بدقة الميلي ثانية (البند 2): مقابض سحب على حافتي المقطع المحدد تقصّان حيًّا بلمسة، و«تقسيم عند الرأس» (مفتاح S) يفصل المقطع الحاوي للرأس إلى مقطعين يرثان التلاشين بحكمة (الأول يحمل الداخلي والثاني الخارجي)، وحذف المحدد (Delete) ممتدٌّ فالخط الزمني التسلسلي يسدّ المكان تلقائيًا.
          • تراجع/إعادة كامل (البند 3): Ctrl+Z وCtrl+Y وأزرار على الصفحة بسجل مئة لقطة، وأثناء سحب القصّ لقطة واحدة للعملية كلها — كل تعديل يمرّ من بوابة واحدة فلا مسار بلا تاريخ ولا بلا حفظ.
          • كروس فيد بين المتجاورة على الخط الزمني (البند 5): إعداد موحّد 0–10 ثوانٍ بخطوات ±250ms يُغني عن الفاصل، كل حدّ يتحول من صمت إلى تداخل بقوة متساوية (cos/sin) بلا هبوط مسموع، والمقاطع الأقصر من النافذة تُحبس آليًا فلا تنهار مدتها، والجسور تُرسم Xًّا على الخط الزمني والمدة الكلية تُخصم حيًّا.
          • إزالة نقرات آلية (البند 6): تلاشي دقيق 8 مللي ثانية على كل حافة قصّ يُضرب في الكسوب دائمًا — أصعب القصوص تخرج صافية بلا طقطقة حتى بلا تلاشٍ من المستخدم.
          • تطبيع المستوى (البند 7): «تطبيع المحدد» يقيس الذروة الخام من المصدر في خيط عمل ويضبط المستوى (1–200٪) ليلامس هدف 95٪ من المدى — مقاطع سُجلت بأجهزة مختلفة تتساوى بنقرة.
          • مؤشر VU وتحذير التشبع (البند 8): مقياس مقطعي حي يقرأ ذروة الدلو تحت الرأس بتلاشٍ سلس بين النبضات، ويصرخ بشارة «قرب التشبع» حين يقترب الكسب من المدى، ومناطق التشبع داخل الويڤ فورم تُرسم أحمر.
          • معاينة من أي نقطة وحلقة A/B (البند 9): «معاينة من الرأس» (أو مسافة) تفتح المعاينة موقوفة عند الرأس فأول ضغطة تكمل لا تعيد، والتصيير يُعاد فقط عند تغيّر المحتوى فالضغطة الثانية فورية، وأزرار A/B تحدد حلقة والنبضة تعيد التشغيل إلى بدايتها آليًا.
          • اختصارات بروتوكول تحرير (البند 10): مسافة معاينة/إيقاف وS تقسيم وDelete حذف و←/→ تحريك الرأس 100 مللي ثانية (ومع Shift: 10 بدقة) و↑/↓ تحديد وCtrl+Z/Y تراجع/إعادة — تعمل حين صفحة المونتاج مفتوحة فقط فلا تسرق مسافة الاستوديو ولا أرقامُه الجينل، وحارس التحرير النصي يحمي الكتابة، ودليل الاختصارات أضيف قسمَ المونتاج.
          • حفظ/فتح ملف مشروع (البند 11): «حفظ المشروع…» يكتب JSON مؤرخًا و«فتح مشروع…» يعيده خلف لقطة تراجع، مع الحفظ الآلي الموجود في montage.json بعد كل تغيير.
          • سحب وإفلات لإعادة الترتيب (البند 12): اسحب جسم المقطع يمينًا أو يسارًا على الخط الزمني فيتبدل مع جاره تِباعًا، وأزرار أعلى/أسفل في القائمة التفصيلية كما هي.
          • إرسال المصدَّر إلى قائمة التشغيل (البند 13) وتصدير WAV قانوني 44.1k ستيريو 16-bit (البند 14) واستعادة المشروع والرأس مع الجلسة (البند 15): المصدَّر يظهر في التسجيلات بتوقيع المذيع ودوره ويُضاف للقائمة الجارية بلا تشغيل فوري — قرار البث للمذيع، وmontage.json يعيد المقاطع والنوافذ وموضع الرأس عند إعادة الفتح ومغلّفات الويڤ فورم تُبنى عند الإقلاع فالخط الزمني لا يولد فارغًا.
          • الإثبات آليًا: 13 اختبار عقد جديدًا (300 مجموعًا): رياضيات الكروس فيد وحبسه بالمقطع الأقصر، قوة متساوية مجموع طاقتها واحد في كل تقدّم، منحنى 8ms على الحافتين، التقسيم وتوزيع التلاشين، سجل التراجع بسقفه ومحو الإعادة، التطبيع من الذروة الخام بحبسه، نبضة الحلقة الصالحة، خلاط كتلي بتداخل حقيقي بين المتجاورة بلا صمت طولي، تلاشي دقيق على قصّ صلب بعينات خام، مغلّفات دلاء ومناطق تشبع وذروة خام من مصدر حقيقي، تحويل رأس→مقطع→دلو، وتوافق المخزن مع ملفات الإصدارات السابقة — مع كتلة selftest موسعة داخل الجرة.
          • فحص بصري Xvfb بست جولات نقر وسحب حقيقية: جلسة مستعادة بالمقاطع والرأس، تقسيم S ورجوع Ctrl+Z وإعادة Ctrl+Y وحذف Delete برسائلها العربية، كروس فيد انكمشت معه المدة 00:09→00:05، تطبيع 70٪←200٪ برسالة الذروة الخام، معاينة من 00:04 تقدم الرأس الحي ومؤشر VU أخضر ينبض، حلقة A/B برسمها وتعملها، تكبير 60→84 بكسل/ث، سحب مقطع بدّل موضعَه وعاد بـCtrl+Z، وتصدير فعلي ملف 940,960 بايت مطابقًا للخطة (5.334 ثانية) بترويسة قانونية وتوقيع مُسجِّل وإضافة موثقة في playlist.json.
          • الجودة: 300 اختبار وحدوي ناجح (+13) + SELFTEST OK — version ${VERSION}.
          • كل القدرات السابقة بلا مساس: صفحة المونتاج بتحريرها وتصديرها (v0.33.0)، وضع «على الهواء» لشاشة ثانية واستعادة الجلسة الأخيرة كاملة (v0.32.0)، كروس فيد وتسجيل مزيج الحصة والمؤقت الآلي (v0.31.0)، قوالب السكريبت وتصدير PDF (v0.30.0)، الاختصارات الاحترافية والتلاشي الناعم (v0.29.0)، جدار الجينغل (v0.28.0)، شريط التقدم (v0.27.0)، سرعة التلقيم (v0.26.0)، استيراد يوتيوب (v0.25.0)، الخطوط الأربعة (v0.24.0).

          ما الجديد في v0.33.0 — صفحة المونتاج: تحرير صوتي كامل دون اتصال يجمع المقاطع في ملف واحد جاهز للبث: إضافة مقاطع من الملفات والتسجيلات بتحديد متعدد وترتيب بأزرار، قصّ بدقة الميلي ثانية بنافذة [بداية، نهاية] بأزرار نتح، مستوى 1–200٪ وتلاشٍ داخلي وخارجي خطيان، فاصل موحّد 0–10 ثوانٍ، ومدة كلية حية؛ معاينة في المشغل نفسه وتصدير WAV قانوني متدفق يوقَّع باسم المذيع ويظهر في التسجيلات وزر إضافته للقائمة بلا تشغيل فوري؛ تصيير موحّد (MP3 عبر JLayer والباقي Java Sound) بطيّ قنوات وإعادة تشكيل 44.1k وتقدم حي وإلغاء نظيف وتخطي المفقود — كل ذلك بلا جهاز صوت ولا شبكة، ومشروع محفوظ آليًا في montage.json يعود بين الجلسات — 10 اختبارات عقد جديدة وفحص بصري بأربع جولات نقر حقيقية بتصدير فعلي مطابق 12.0 ثانية.
          ما الجديد في v0.32.0 — العرض والموثوقية: وضع «على الهواء» ملء الشاشة لشاشة ثانية يتابعها الطلاب بنافذة عرض مسرحية حية مستقلة (الفقرة الجارية وشريط تقدمها والمتبقي للفاصل الآلي والموسيقى والتالية والساعة وشارة نابضة، وكشف الشاشة الثانية تلقائيًا بلا إطارات)، واستعادة الجلسة الأخيرة كاملة عند إعادة الفتح (session.json يكمل playlist.json وscript.json — المقطع الجاري وموضعه يُحفظان دوريًا كل 4 ثوانٍ وعند الإغلاق، والإقلاع يفتحه موقوفًا عند موضع الإغلاق فأول ضغطة تكمل لا تعيد، والفقرة المحددة ووضع القراءة الكاملة يعودان، والتعقيم صارم فلا جلسة تالفة تكسر الإقلاع) — 11 اختبارًا جديدًا وفحص بصري بأربع جولات نقرات.
          ما الجديد في v0.31.0 — البث الاحترافي: كروس فيد بين المقاطع بتلاشٍ مزدوج على كسب الخطوط بنافذة 1/3/5/8 ثوانٍ (آلي قبل النهاية ويدوي أثناء التشغيل وإجهض عند الإيقاف)، تسجيل مزيج الحصة كاملًا بناقل MixBus يجمع الموسيقى والميكروفون وجينلات الجدار في ملف WAV واحد 44.1k ستيريو متدفق، ومؤقت فاصل آلي بقرارات حتمية على زمن الفقرات وجينل فاصل خارج شبكة الجدار وتقدم آلي محفوظ — 13 اختبارًا جديدًا وفحص بصري كامل.
          ما الجديد في v0.30.0 — قوالب السكريبت وتصدير PDF: زر «قوالب جاهزة» بستة قوالب إذاعة مدرسية حقيقية بإلحاق فوري واستبدال خلف تأكيد، وزر «تصدير PDF» بوثيقة A4 عربية RTL متجهة بخط Cairo المدمج عبر PDFBox وAWT برأس وتذييل وشريط فقرات وحوار حفظ مؤرخ — 9 اختبارات جديدة وفحص بصري كامل حتى ملف حقيقي بصفحتين.

          ما الجديد في v0.29.0 — الاختصارات الاحترافية والتلاشي الناعم (من مقترحات الاحترافية): مسافة تشغيل/إيقاف و1-9 لإطلاق الجينل والأسهم سعي ±5 ثوانٍ وN/P تالي/سابق وM كتم — من النافذتين معًا وحارس تحرير يُهمّلها ما دام حقل في البؤرة، دليل الاختصارات من الشريط العلوي، والإيقاف يخرج تلاشيًا 350ms والاستئناف يصعد 300ms عبر غلاف كسب يُجهض فورًا عند سعي/تبديل/إيقاف — 7 اختبارات عقد جديدة وفحص بصري كامل.
          ما الجديد في v0.28.0 — جدار الجينغل: اثنا عشر موضعًا كالجدران الإذاعية الحقيقية بنقرة إطلاق ونقرة إيقاف وتزامن حقيقي بين المواضع مع «إيقاف الكل» ومستوى عام محفوظ، سبع جينلات مدرسية مدمجة بالجرة (نفس جينلات الهاتف بتراخيصها) تُستخرج عند الإقلاع وتملأ المواضع السبعة الأولى والخمسة الباقية لتعيين مقاطع المدرسة من أي WAV/MP3/OGG/FLAC بحوار ملفات، والتعيين والمسح والمستوى تُحفظ في settings.json وتعود بين الجلسات، وزر «جدار الجينغل» في الشريط العلوي يفتحه بنافذة مستقلة غير ماسكة يظل الاستوديو عاملاً بكامل أدواته ما دامت مفتوحة، والجينلات تخرج من مخرجَي الموسيقى المختارَين نفسهما — 11 اختبارًا جديدًا وفحص بصري كامل للنافذة والاستوديو معًا.
          ما الجديد في v0.27.0 — إصلاح جذري لعطل «شريط التقدم بالنقر والسحب في المشغل لا يعمل جيدًا»: العطل كان في العرض لا الصوت ولا الإيماءة — عرض الموضع كان يتحدث من قراءة الكتل فقط بينما السعي يُنفَّذ في القارئ مباشرة، فالإفلات أثناء التشغيل يومض للموضع القديم وأثناء الإيقاف المؤقت كان الارتداد كاملًا ودائمًا؛ الإصلاح بتحديث متفائل فوري وترسيخ العرض على موضع القارئ بعد السعي مع فوز آخر نقرة، ويرثه شريطا الموسيقى والمشغل المستقل معًا، بخمسة اختبارات عقد على حلقة المحرك الحقيقية بقارئ مزيف.

          ما الجديد في v0.26.0 — تحكم حر في سرعة التلقيم مع «بطيئة جدًا» وتوحيد تحكم حيزات العمود الأيسر وإصلاح عطل Program Files في استيراد يوتيوب: منزلق حر (6–260 بكسل/ث) بقراءة رقمية حية واسم حالة وخمس جاهزات أضافت «بطيئة جدًا» (12) والحرة تُحفظ بين الجلسات، بطاقتا الميكروفون والموسيقى يسارًا يتغير حجمهما بالفاصل كالعمود الأيمن تمامًا مع تمرير داخلي للميكروفون، وأداة يوتيوب تعمل في مجلد مؤقت آمن قابل للكتابة بلا Errno 13 داخل Program Files مع رسالة عربية واضحة.

          ما الجديد في v0.25.0 — استيراد المقاطع الموسيقية من اليوتيوب في صفحة الموسيقى مع تحميلها: زر «استيراد من يوتيوب» يفتح حوارًا يفهم الرابط والبحث معًا ببطاقة مقطع ونتائج بحث واختيار التصنيف، الأداة مدمجة لكل منصة (yt-dlp: ويندوز/لينكس/ماك) بلا تثبيت خارجي بتقدم حي وإلغاء، والتحويل محلي نقي AAC→MP3 بJAAD وLAME فتدخل المقاطع المكتبة بأضمن صيغة لمحرك البث، مع تصنيف عربي للأخطاء وخيار ملف كوكيز.

          ما الجديد في v0.24.0 — نظام الطباعة الرباعي المدمج: Cairo للمتون والنصوص وChanga للعناوين وOrbitron للأرقام والساعات والأزمنة عبر نمط numeric() وSpicy Sale للهوية اللاتينية المرحة عبر brand()، كلها تُحمَّل من موارد الجرة فتبدو الواجهة واحدة على ويندوز ولينكس وماك، مع وثيقة تراخيص LICENSES.md وإسناد طباعي نقي مختبر.

          ما الجديد في v0.23.0 — التنقل في المقطع بالنقر والسحب في شريط التقدم: مكوّن StudioSeekBar مرسوم بيد بدل Slider المكتبة المعطوب بإيماءات الفأرة على الحاسوب — النقر ينقل فورًا والسحب يعاين حيًّا ثم سعي واحد بالضبط عند الإفلات بحالة ScrubState نقية، في مشغلي الموسيقى معًا باتجاه LTR وهالة سماوية وحاضن لمس 36dp، وسعي MP3 أدق بجدول Xing المئوي ومتوسط معدل البت للـVBR ومعدل الإطار الأول للـCBR، مع إصلاح زر «تشغيل» الميت بعد إعادة فتح التطبيق.

          ما الجديد في v0.22.0 — تطوير الواجهة الرسومية بهوية بصرية موحدة: خط عربي مدمج Noto Sans Arabic بأربعة أوزان من موارد الجرة فتبدو الواجهة واحدة على كل الأنظمة، ثيم أعمق الطبقات بحواف بطاقات مرسومة وتباين WCAG 2.1 مختبر، مكوّنات موحدة (بطاقات 16dp وترويسات أقسام وكبسولات حالة وأزرار 36dp)، مقاييس مستوى مقطعية بألوان المناطق الإذاعية، توهج سماوي لفواصل سحب الحيزات، شعار وأيقونة للنافذة والمثبّت، وحد أدنى للنافذة 1024×640.

          ما الجديد في v0.21.0 — حيزات الاستوديو بالفأرة وشاشة قراءة بسكريبت واحد يزحف من الأسفل إلى الأعلى: فواصل سحب للأبعاد الخمسة (عرض الجانب الأيمن وعمود البث وثلاثة فواصل أفقية داخلية) تُحفظ في settings.json وتعود بين الجلسات، الجانب الأيمن متساويان ٥٠/٥٠، حيّز الموسيقى يأخذ كل المساحة الباقية فتظهر القوائم بعدد صفوف كبير، سطرا المداخل والمخارج في حيّز البث، وشاشة القراءة بفقرة واحدة يبدأ نصها من الحافة السفلية ويمرّ كل سطورها عبر مؤشر القراءة الثابت بتوقف تلقائي.

          ما الجديد في v0.20.0 — شاشة قراءة احترافية ومؤشر قراءة وحفظ الأجهزة والسرعة الرابعة: مؤشر قراءة ثابت في منتصف الشاشة (شريط تركيز + خط إرشادي + سهمان) يزحف النص عبره، الفقرة الجارية بتوهجها الكامل وإطارها الأخضر وبقية الفقرات معتمة، ساعة حية وشريطا تحكم منسقان، سرعة رابعة «سريعة جدًا» 170 بكسل/ث تدور مع الثلاث، حفظ اختيار الأجهزة (مدخلان ومخرجان) بأسمائها في settings.json بارتداد آمن للأول و«بلا» للثاني، وتفضيلات القراءة (خط/سرعة/متابعة) تُذكر بين الجلسات.

          ما الجديد في v0.19.0 — مخرجان ومدخلان وشاشة قراءة تلقيمية: محدد إخراج ثانٍ يُفتح حصريًا على جهازه مع خط إخراج موحّد يكتب نفس الكتلة في الجهازين معًا فتبقى القاعتان نسخة واحدة متطابقة، ومدخل ثانٍ يُفتح بصرامة على جهازه ويُخلط في صوت المذيع قبل السلسلة كلها بخلاط نقّي (طيّ قنوات + إعادة تشكيل خطي + جمع محبوس بلا لفّ أعداد صامتة ولا انزياح تراكمي)، وشاشة سكريبت تلقيمية بملء النافذة بتمرير آلي ومتابعة الجارية وعدّاد فقرات وشريط تقدّم، وأزرار «شاشة القراءة» في اللوحات الثلاث.

          ما الجديد في v0.18.0 — مشهد الصوت: حزمة البث الكاملة بنقرة واحدة (قناع الرعد + بوابة الضجيج + تسوية AGC + الضاغط + منحنى البث عبر حلقتي hpfOn/agcOn الجديدتين والأنماط القديمة لا تمسهما) وأعماق خفض جاهزة بنقرة (خفيف −6dB / متوسط −12dB / قوي −20dB فوق المنزلق الدقيق) ومؤشر AGC الحي «الكسب الآلي الآن: ±X.X dB» لحظة بلحظة أثناء البث.

          ما الجديد في v0.13.0 — مشغل أقوى + إصلاح جذري للمكتبة + AEC الجيل الثاني: صيغ OGG/FLAC ببوابة صيغ واحدة تمنع دخول ما لا يُفكّ، لا فشل صامت مع شريط خطأ واضح، تكرار ثلاثي وعشوائي بمنطق خالص محفوظ، ومرجع متصل ببحث تأخير خشن ثم دقيق وNLMS زمني 2048 طرقة بمؤشر ERLE حي، وتخفيض تأخير الموسيقى إلى ~85ms وحيز التسجيلات فوق الجدولة.

          ما الجديد في v0.12.0 — مشغل موسيقى احترافي + تصنيف كامل + استوديو يبثّ من مكتبته:
          • قوائم تشغيل مسماة بعدة قوائم بأسمائك وترحيل آلي بلا فقد، بطاقة «قيد التشغيل الآن» الكبيرة بتحكم نقل كامل وقائمة حية قابلة للترتيب والإزالة، رقائق تصنيفات بأعداد المقاطع ونقل المقطع بين التصنيفات، ومشغل هواء كامل في عمود بث الاستوديو والبث المباشر.

          ما الجديد في v0.11.0 — الإذاعة الاحترافية الحقيقية:
          • الخفض التلقائي للموسيقى (Voice-Over Ducker): حين تتكلم على الميكروفون تنخفض الموسيقى آليًا بالمقدار الذي تختاره (3–30dB) وتعود بعد «زمن التعليق» — بمؤشر حي وانتقالات ناعمة.
          • إلغاء صدى الميكروفون (AEC): محلّ تكيّفي يطرح صدى الموسيقى من صوت المذيع — هواء صافٍ بمؤشر حالة حي (النسخة v0.13.0 أعادت بناءه جيلًا ثانيًا بمرجع متصل ومعايرة دقيقة).
          • توحيد الكسب الأوتوماتيكي (AGC): مستوى نطق ثابت بهدف إذاعي وسقف تعزيز وتجميد عند الصمت.
          • الترتيب الإذاعي: AEC ← قناع الرعد ← بوابة ← AGC ← منحنى ← ضاغط ← محدد الأمان ← الفيدرات، كل المعاملات حية ومحفوظة.

          الإصدارات السابقة (v0.15.0 فما دون): المشغّل المستقل ببطاقة «قيد التشغيل الآن» وشريط تقدم قابل للسعي (v0.15.0)، وحدة المزج الإذاعية بمعالج صوت المذيع والمعادل خمسة الشرائح، مواكبة قدرات نسخة الهاتف التسع، واجهة بطابع غرفة التحكم، إصلاح فتح الميكروفون على الأجهزة المقيّدة، وعودة الاستوديو المدمج — التفاصيل في ملاحظات كل إصدار.

          الوظائف الأساسية (من v0.1.0 و v0.2.0):
          • بث مباشر للميكروفون: اختيار جهاز الإدخال ومخرج السماعات، مقياس مستوى حي، سماع مراقب، وتسجيل WAV أثناء البث.
          • تشغيل الموسيقى: قائمة تشغيل MP3/WAV/OGG/FLAC، بحث زمني، تحكم بالصوت، التالي/السابق، انتقال تلقائي، تكرار وعشوائية.
          • التسجيلات: مكتبة تسجيلات مع التشغيل وإعادة التسمية والحذف وتغيير المجلد.
          • سكريبت المذيع: تحرير فقرات النص مع لوحة قراءة كبيرة الخط وعدّاد كلمات وزمن قراءة تقديري.
          • جدولة الفقرات: فقرات الحلقة بأنواعها ومدد مخططة وساعة بداية، مع لوحة تشغيل حي.

          الملفات:
          • SchoolRadioDesktop_v${VERSION}-windows-x64.msi — مثبّت ويندوز (يتضمّن جافا، لا يحتاج أي تثبيت مسبق).
          • SchoolRadioDesktop_v${VERSION}-windows-x64.jar — لويندوز عبر جافا 17+ (java -jar).
          • SchoolRadioDesktop_v${VERSION}-linux-x64.jar — للينكس عبر جافا 17+.
          • SchoolRadioDesktop_v${VERSION}-macos-arm64.jar — لماك (Apple Silicon) عبر جافا 17+.

          مشروع مستقل تمامًا عن نسخة الهاتف (school-radio-android).
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          FILES=(rel/*.jar)
          if [ -d relmsi ]; then FILES+=(relmsi/*.msi); fi
          gh release create "$TAG" "${FILES[@]}" \
            --title "إذاعة مدرسية احترافي — نسخة الحاسوب v${VERSION}" \
            --notes-file notes.md --latest
